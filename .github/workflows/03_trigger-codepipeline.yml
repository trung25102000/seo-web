name: Trigger AWS CodePipeline

on:
  workflow_run:
    workflows:
      - Build Artifact
    types:
      - completed
  workflow_dispatch:

jobs:
  trigger-codepipeline:
    name: Trigger Deployment Pipeline
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CODEPIPELINE_NAME: ${{ secrets.CODEPIPELINE_NAME }}

    steps:
      - name: Configure AWS credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' && env.CODEPIPELINE_NAME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger pipeline execution
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' && env.CODEPIPELINE_NAME != '' }}
        run: |
          aws codepipeline start-pipeline-execution \
            --name "${CODEPIPELINE_NAME}"

      - name: Validate required secrets
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' || env.AWS_REGION == '' || env.CODEPIPELINE_NAME == '' }}
        run: |
          echo "Missing required GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, CODEPIPELINE_NAME"
          exit 1
